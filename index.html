<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vunja AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eef2f6;--ink:#14213d;--muted:#5b6678;--line:#cfd8e3;--card:#fff;--teal:#0f7b6c;--saffron:#f4a300}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--ink:#e8eef7;--muted:#9aa7ba;--line:#26344d;--card:#16213a;--teal:#38c2ad;--saffron:#f4b73a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;max-width:1120px;margin:0 auto;padding:32px 18px 60px;align-items:start}
main{max-width:760px;min-width:0;margin:0;padding:0}
#hist{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
#hist h2{font:800 20px "Bricolage Grotesque",sans-serif;margin:0 0 10px}
#histList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
#histList li{display:flex;gap:4px}
.hitem{flex:1;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
.hitem.on{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.hname{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{display:block;font-size:13px;color:var(--muted)}
.hdel{background:transparent;color:var(--muted);border:1px solid var(--line);padding:0 10px;font-size:18px;line-height:1}
.hnote{font-size:13px;color:var(--muted);margin:10px 0 0}
.hclear{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 12px;font-size:14px;margin-top:10px}
@media(max-width:860px){.layout{grid-template-columns:1fr}#hist{position:static}#histList{max-height:220px}}
h1{font:800 clamp(44px,12vw,84px)/.95 "Bricolage Grotesque",sans-serif;margin:0 0 10px;letter-spacing:-.02em}
h1 span{color:var(--saffron)}
.lead{color:var(--muted);margin:0 0 28px;max-width:52ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=file],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
button{font:600 17px "Source Sans 3",sans-serif;padding:12px 22px;border:0;border-radius:8px;cursor:pointer;background:var(--teal);color:#fff}
button.alt{background:var(--saffron);color:#14213d}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
#info,#err{margin:10px 0 0;font-size:15px}#info{color:var(--muted)}#err{color:#c0392b}
#out h2,#out h3{font-family:"Bricolage Grotesque",sans-serif;margin:1.2em 0 .4em}
#out table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:10px 0}
#out th,#out td{border:1px solid var(--line);padding:6px 10px;text-align:left}
#out th{background:var(--bg)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#log{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:10px;max-width:92%}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg p{margin:.3em 0}
.chatrow{display:flex;gap:10px}.chatrow textarea{min-height:48px}
.chartbox{margin:18px 0;padding:10px;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<div class="layout">
<aside id="hist" aria-label="Analyzed files">
  <h2>Analyzed files</h2>
  <ul id="histList"></ul>
  <p class="hnote" id="histNote">Saved in this browser only.</p>
  <button class="hclear" id="histClear" hidden>Clear history</button>
</aside>
<main>
<h1>Vunja <span>AI</span></h1>
<p class="lead">Upload your statistics file. Vunja AI analyzes it and writes a report you can download.</p>

<section class="panel">
  <label for="file">Data files (Excel or CSV — select several; every sheet is read)</label>
  <input id="file" type="file" accept=".xlsx,.xls,.csv" multiple>
  <p id="info">No file selected.</p>
  <div class="row" style="margin-top:14px">
    <div>
      <label for="req">What do you want analyzed?</label>
      <textarea id="req" placeholder="Example: Compare sales by month and show the best-selling products."></textarea>
    </div>
  </div>
  <div class="actions"><button id="go" disabled>Analyze data</button></div>
  <p id="err" role="alert"></p>
</section>

<section class="panel" id="result" hidden>
  <div id="out"></div>
  <div id="charts"></div>
  <div class="actions">
    <button class="alt" id="word">Download as Word</button>
    <button class="alt" id="copy">Copy report</button>
  </div>
</section>
<section class="panel" id="chat" hidden>
  <label for="q">Ask Vunja AI about your data</label>
  <div id="log" aria-live="polite"></div>
  <div class="chatrow">
    <textarea id="q" placeholder="Example: Which customer bought the most this month?"></textarea>
    <button id="send">Send</button>
  </div>
</section>
</main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let rows = [], headers = [], reportMd = '', lastPayload = null, history = [], lastSpecs = [], lastCharts = [], currentId = null, rowsId = null, fileNames = [];

$('file').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files); if (!files.length) return;
  rowsId = null; fileNames = files.map((f) => f.name);
  $('err').textContent = ''; $('go').disabled = true;
  try {
    const parts = [];
    for (const f of files) {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
      const fp = [];
      wb.SheetNames.forEach((sn) => {
        const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' });
        if (r.length) fp.push({ file: f.name, sheet: sn, rows: r });
      });
      fp.forEach((x) => { x.n = fp.length; parts.push(x); });
    }
    const multiSheet = parts.some((x) => x.n > 1);
    let all = [], colSets = [];
    parts.forEach((x) => {
      colSets.push(Object.keys(x.rows[0]).sort().join('|'));
      all = all.concat(x.rows.map((r) => {
        const o = {}; for (const k in r) o[k] = r[k] instanceof Date ? fmtDate(r[k]) : r[k];
        if (files.length > 1) o['Source file'] = x.file;
        if (multiSheet) o['Source sheet'] = x.sheet;
        return o;
      }));
    });
    const before = all.length; all = all.filter((r) => !isTotalRow(r)); const removed = before - all.length;
    headers = []; all.forEach((r) => Object.keys(r).forEach((k) => { if (!headers.includes(k)) headers.push(k); }));
    rows = all.map((r) => { const o = {}; headers.forEach((h) => { o[h] = h in r ? r[h] : ''; }); return o; });
    const same = colSets.every((c) => c === colSets[0]);
    $('info').textContent = (parts.length > 1 ? parts.length + ' sheets from ' + files.length + ' file(s) combined, ' : '') + rows.length + ' rows, ' + headers.length + ' columns: ' + headers.join(', ') +
      (removed ? ' (' + removed + ' TOTAL/summary row(s) removed so they don’t distort the numbers)' : '') +
      (!same ? ' Note: the sheets have different columns, so they were matched by column name.' : '');
    $('go').disabled = !rows.length;
  } catch (x) { $('err').textContent = 'Could not read one of the files. Make sure they are Excel or CSV.'; }
});
function exactTables() {
  const isNum = (h) => rows.filter((r) => r[h] !== '' && !isNaN(Number(r[h]))).length > rows.length * 0.7;
  const isDateCol = (h) => rows.filter((r) => dkey(r[h])).length > rows.length * 0.7;
  const dateCols = headers.filter(isDateCol);
  const numCols = headers.filter((h) => isNum(h) && !isDateCol(h) && !/^id$/i.test(h));
  const catCols = headers.filter((h) => !isNum(h) && !isDateCol(h));
  const fmt = (n) => Math.round(n * 100) / 100;
  const group = (keyFn, valFn) => {
    const g = {};
    rows.forEach((r) => { const k = keyFn(r); if (k === null || k === '') return; const o = g[k] || (g[k] = { sum: 0, c: 0 }); o.c++; const v = Number(valFn(r)); if (!isNaN(v)) o.sum += v; });
    return g;
  };
  const top = (g, key) => Object.entries(g).sort((a, b) => b[1][key] - a[1][key]).slice(0, 15).map(([k, o]) => k + '=' + fmt(o[key])).join(', ');
  const out = [];
  catCols.forEach((c) => {
    const distinct = new Set(rows.map((r) => String(r[c]))).size;
    if (distinct < 2 || distinct > 100) return;
    out.push('By ' + c + ' → number of rows (top 15, highest first): ' + top(group((r) => String(r[c]), () => 0), 'c'));
    numCols.forEach((nc) => out.push('By ' + c + ' → ' + nc + ' (sum, top 15, highest first): ' + top(group((r) => String(r[c]), (r) => r[nc]), 'sum')));
  });
  dateCols.slice(0, 1).forEach((dc) => {
    ['month', 'quarter', 'day'].forEach((unit) => {
      const keyFn = (r) => {
        const k = dkey(r[dc]); if (!k) return null;
        if (unit === 'month') return k.slice(0, 7);
        if (unit === 'quarter') return k.slice(0, 4) + '-Q' + (Math.floor((Number(k.slice(5, 7)) - 1) / 3) + 1);
        return k;
      };
      const g0 = group(keyFn, () => 0);
      const keys = Object.keys(g0).sort(); const use = unit === 'day' ? keys.slice(-31) : keys;
      out.push('By ' + unit + ' (' + dc + ') → number of rows: ' + use.map((k) => k + '=' + g0[k].c).join(', '));
      numCols.forEach((nc) => { const g = group(keyFn, (r) => r[nc]); out.push('By ' + unit + ' (' + dc + ') → ' + nc + ' (sum): ' + use.map((k) => k + '=' + fmt(g[k].sum)).join(', ')); });
    });
  });
  return out.join('\n');
}
function sampleRows() { const step = Math.max(1, Math.ceil(rows.length / 400)); return rows.filter((_, i) => i % step === 0); }

function stats() {
  return headers.map((h) => {
    const vals = rows.map((r) => r[h]);
    const nums = vals.map(Number).filter((n, i) => vals[i] !== '' && !isNaN(n));
    if (nums.length > vals.length * 0.7) {
      const sum = nums.reduce((a, b) => a + b, 0);
      return h + ': number, count=' + nums.length + ', sum=' + sum.toFixed(2) + ', mean=' + (sum / nums.length).toFixed(2) + ', min=' + Math.min(...nums) + ', max=' + Math.max(...nums);
    }
    const c = {}; vals.forEach((v) => { c[v] = (c[v] || 0) + 1; });
    const top = Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, n]) => k + '(' + n + ')').join(', ');
    return h + ': text, distinct=' + Object.keys(c).length + ', top: ' + top;
  }).join('\n');
}

$('go').addEventListener('click', async () => {
  $('go').disabled = true; $('go').textContent = 'Analyzing...'; $('err').textContent = '';
  try {
    const sample = XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(sampleRows()));
    const r = await fetch('/api/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(lastPayload = { summary: 'Total rows: ' + rows.length + '\n' + stats() + '\n\nEXACT TABLES (counted by the app from ALL rows):\n' + exactTables(), sample, request: $('req').value, lang: 'en', columns: headers })
    });
    const d = await readJson(r);
    if (!r.ok || d.error) throw new Error(d.error || 'Failed');
    const sp = splitCharts(d.report); lastSpecs = sp.specs; reportMd = sp.txt; $('out').innerHTML = md(reportMd);
    lastCharts = sp.specs.slice(0, 3).map(toComputed).filter(Boolean);
    $('charts').innerHTML = ''; drawComputed(lastCharts, $('charts')); $('result').hidden = false;
    history = [{ role: 'model', text: d.report }]; $('log').innerHTML = ''; $('chat').hidden = false;
    currentId = Date.now(); rowsId = currentId;
    upsertEntry({ id: currentId, time: new Date().toISOString(), files: fileNames.slice(), rows: rows.length, request: $('req').value, report: reportMd, charts: lastCharts, payload: lastPayload, history: history });
    $('result').scrollIntoView({ behavior: 'smooth' });
  } catch (x) { $('err').textContent = 'Error: ' + x.message; }
  $('go').disabled = false; $('go').textContent = 'Analyze data';
});

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function inl(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>'); }
function md(t) {
  const L = t.split('\n'); let h = '', list = false, tbl = [];
  const endList = () => { if (list) { h += '</ul>'; list = false; } };
  const endTbl = () => {
    if (!tbl.length) return;
    const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => inl(c.trim()));
    const body = tbl.filter((l) => !/^\s*\|?[\s:-]+\|[\s|:-]*$/.test(l));
    h += '<table>' + body.map((l, i) => '<tr>' + cells(l).map((c) => (i ? '<td>' : '<th>') + c + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>';
    tbl = [];
  };
  for (const l of L) {
    if (/^\s*\|/.test(l)) { endList(); tbl.push(l); continue; } else endTbl();
    if (/^#{1,3}\s/.test(l)) { endList(); h += '<h2>' + inl(l.replace(/^#+\s/, '')) + '</h2>'; }
    else if (/^\s*[-*]\s+/.test(l)) { if (!list) { h += '<ul>'; list = true; } h += '<li>' + inl(l.replace(/^\s*[-*]\s+/, '')) + '</li>'; }
    else if (l.trim()) { endList(); h += '<p>' + inl(l) + '</p>'; }
  }
  endList(); endTbl(); return h;
}

$('word').addEventListener('click', async () => {
  const imgs = [];
  const prevColor = Chart.defaults.color; Chart.defaults.color = '#000';
  lastCharts.forEach((c) => {
    const cv = document.createElement('canvas'); cv.width = 900; cv.height = 450;
    new Chart(cv, { type: c.type,
      data: { labels: c.labels, datasets: [{ label: c.y, data: c.vals, backgroundColor: '#0f7b6c', borderColor: '#0f7b6c', tension: .25 }] },
      options: { animation: false, responsive: false, devicePixelRatio: 1, plugins: { legend: { display: false }, title: { display: true, text: c.title } } },
      plugins: [{ id: 'bg', beforeDraw(ch) { const x = ch.ctx; x.save(); x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, ch.width, ch.height); x.restore(); } }] });
    imgs.push({ title: c.title, data: cv.toDataURL('image/png').split(',')[1] });
  });
  Chart.defaults.color = prevColor;
  try {
    const blob = await buildDocx(reportMd, imgs, JSZip).generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Vunja-AI-Report.docx'; a.click();
  } catch (x) { $('err').textContent = 'Could not create Word file: ' + x.message; }
});
$('copy').addEventListener('click', () => { navigator.clipboard.writeText(reportMd); $('copy').textContent = 'Copied'; });
function isTotalRow(r) { return Object.values(r).some((v) => typeof v === 'string' && /^\s*(grand\s*)?(total|jumla)s?\s*:?\s*$/i.test(v)); }
function fmtDate(d) { const p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function dkey(v) {
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5); return d.toISOString().slice(0, 10); }
  const t = String(v).trim(); let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  if ((m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return null;
}
function splitCharts(t) {
  let specs = [];
  const txt = t.replace(/```charts\s*([\s\S]*?)```/g, (m, j) => { try { specs = specs.concat(JSON.parse(j)); } catch (e) {} return ''; });
  return { txt: txt.trim(), specs };
}
function computeChart(sp) {
  if (!headers.includes(sp.x) || (sp.agg !== 'count' && !headers.includes(sp.y))) return null;
  const isDate = rows.filter((r) => dkey(r[sp.x])).length > rows.length * 0.7;
  let data = rows;
  if (isDate && sp.lastDays) {
    const mx = Math.max(...rows.map((r) => dkey(r[sp.x])).filter(Boolean).map((k) => Date.parse(k)));
    data = rows.filter((r) => { const k = dkey(r[sp.x]); return k && Date.parse(k) >= mx - (sp.lastDays - 1) * 864e5; });
  }
  const ex = (sp.exclude || []).map((v) => String(v).toLowerCase());
  if (ex.length) data = data.filter((r) => !ex.includes(String(r[sp.x]).toLowerCase()));
  const g = {};
  data.forEach((r) => {
    const key = isDate ? dkey(r[sp.x]) : String(r[sp.x]); if (!key) return;
    const n = Number(r[sp.y]); const o = g[key] || (g[key] = { sum: 0, c: 0 });
    o.c++; if (!isNaN(n)) o.sum += n;
  });
  let e = Object.entries(g).map(([k, o]) => [k, sp.agg === 'count' ? o.c : sp.agg === 'avg' ? o.sum / o.c : o.sum]);
  if (isDate) e.sort((a, b) => a[0] < b[0] ? -1 : 1);
  else { e.sort((a, b) => b[1] - a[1]); e = e.slice(0, sp.top || 10); }
  return { labels: e.map((x) => x[0]), vals: e.map((x) => Math.round(x[1] * 100) / 100) };
}
function toComputed(sp) {
  const c = computeChart(sp); if (!c || !c.labels.length) return null;
  return { title: sp.title || 'Chart', type: sp.type === 'line' ? 'line' : 'bar', y: sp.y || 'Count', labels: c.labels, vals: c.vals };
}
function drawComputed(list, box) {
  Chart.defaults.color = getComputedStyle(document.body).color;
  list.forEach((c) => {
    const wrap = document.createElement('div'); wrap.className = 'chartbox';
    const cv = document.createElement('canvas'); wrap.appendChild(cv); box.appendChild(wrap);
    new Chart(cv, { type: c.type,
      data: { labels: c.labels, datasets: [{ label: c.y, data: c.vals, backgroundColor: '#0f7b6c', borderColor: '#0f7b6c', tension: .25 }] },
      options: { responsive: true, plugins: { legend: { display: false }, title: { display: true, text: c.title } } } });
  });
}
function drawCharts(specs, box) { drawComputed(specs.slice(0, 3).map(toComputed).filter(Boolean), box); }

function xe(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function wRuns(t, o) {
  o = o || {}; const out = []; const re = /(\*\*[^*]+\*\*|\*[^*]+\*)/g; let last = 0, m;
  const push = (x, b, i) => { if (!x) return; out.push('<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>' + ((b || o.b) ? '<w:b/>' : '') + (i ? '<w:i/>' : '') + '<w:sz w:val="' + (o.sz || 22) + '"/></w:rPr><w:t xml:space="preserve">' + xe(x) + '</w:t></w:r>'); };
  while ((m = re.exec(t))) { push(t.slice(last, m.index)); if (m[0].startsWith('**')) push(m[0].slice(2, -2), 1, 0); else push(m[0].slice(1, -1), 0, 1); last = m.index + m[0].length; }
  push(t.slice(last)); return out.join('');
}
function wPara(t, o, ppr) { return '<w:p>' + (ppr ? '<w:pPr>' + ppr + '</w:pPr>' : '') + wRuns(t, o) + '</w:p>'; }
function mdToDocx(md) {
  let x = '', tbl = [];
  const flush = () => {
    if (!tbl.length) return;
    const rws = tbl.filter((l) => !/^\s*\|?[\s:-]+\|[\s|:-]*$/.test(l)).map((l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim()));
    const n = Math.max(...rws.map((r) => r.length)), gw = Math.floor(9400 / n);
    x += '<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>' + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map((k) => '<w:' + k + ' w:val="single" w:sz="4" w:space="0" w:color="888888"/>').join('') + '</w:tblBorders></w:tblPr><w:tblGrid>' + '<w:gridCol w:w="' + gw + '"/>'.repeat(n) + '</w:tblGrid>';
    rws.forEach((r, i) => {
      x += '<w:tr>';
      for (let c = 0; c < n; c++) x += '<w:tc><w:tcPr><w:tcW w:w="' + gw + '" w:type="dxa"/>' + (i === 0 ? '<w:shd w:val="clear" w:color="auto" w:fill="E8EDF3"/>' : '') + '</w:tcPr>' + wPara(r[c] || '', { b: i === 0, sz: 20 }, '<w:spacing w:after="0"/>') + '</w:tc>';
      x += '</w:tr>';
    });
    x += '</w:tbl><w:p/>'; tbl = [];
  };
  for (const l of md.split('\n')) {
    if (/^\s*\|/.test(l)) { tbl.push(l); continue; } else flush();
    if (/^#{1,3}\s/.test(l)) x += wPara(l.replace(/^#+\s*/, ''), { b: 1, sz: /^###/.test(l) ? 24 : 28 }, '<w:keepNext/><w:spacing w:before="240" w:after="80"/>');
    else if (/^\s*[-*]\s+/.test(l)) x += wPara('\u2022 ' + l.replace(/^\s*[-*]\s+/, ''), {}, '<w:spacing w:after="40"/><w:ind w:left="360" w:hanging="260"/>');
    else if (l.trim()) x += wPara(l, {}, '<w:spacing w:after="100"/>');
  }
  flush(); return x;
}
function wImg(rid, id) {
  const cx = 5486400, cy = 2743200;
  return '<w:p><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="' + cx + '" cy="' + cy + '"/><wp:docPr id="' + id + '" name="Chart ' + id + '"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="' + id + '" name="chart' + id + '.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}
function buildDocx(md, imgs, JSZipLib) {
  const z = new JSZipLib();
  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"';
  let body = wPara('Vunja AI Report', { b: 1, sz: 36 }, '<w:spacing w:after="60"/>') + wPara(fmtDate(new Date()), { sz: 20 }, '<w:spacing w:after="200"/>') + mdToDocx(md);
  let rels = '';
  imgs.forEach((im, i) => {
    body += wPara(im.title, { b: 1 }, '<w:keepNext/><w:spacing w:before="240" w:after="80"/>') + wImg('rIdImg' + (i + 1), i + 1);
    rels += '<Relationship Id="rIdImg' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/chart' + (i + 1) + '.png"/>';
    z.file('word/media/chart' + (i + 1) + '.png', im.data, { base64: true });
  });
  z.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels + '</Relationships>');
  z.file('word/document.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ' + NS + '><w:body>' + body + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return z;
}
async function readJson(r) {
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) {
    return { error: (r.status === 504 || /timeout|timed out/i.test(t)) ? 'The server took too long to answer. Please try again.' : 'Server error (' + r.status + '). Please try again in a moment. If it keeps happening, check the Logs in Vercel.' };
  }
}
function add(cls, html) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html;
  $('log').appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return d;
}
async function ask() {
  const q = $('q').value.trim(); if (!q || !lastPayload) return;
  $('q').value = ''; add('me', esc(q)); $('send').disabled = true;
  try {
    const r = await fetch('/api/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({}, lastPayload, { history, question: q }))
    });
    const d = await readJson(r);
    if (!r.ok || d.error) throw new Error(d.error || 'Failed');
    history.push({ role: 'user', text: q }, { role: 'model', text: d.report });
    const sp = splitCharts(d.report); const m = add('ai', md(sp.txt)); if (rowsId !== null && rowsId === currentId) drawCharts(sp.specs, m);
    persist();
  } catch (x) { add('ai', 'Error: ' + esc(x.message)); }
  $('send').disabled = false;
}
$('send').addEventListener('click', ask);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });

const HKEY = 'vunja_history_v1';
function loadHist() { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) { return []; } }
function saveHist(list) {
  list = list.slice(0, 30);
  while (list.length) { try { localStorage.setItem(HKEY, JSON.stringify(list)); return true; } catch (e) { list.pop(); } }
  return false;
}
function upsertEntry(e) { const list = loadHist().filter((x) => x.id !== e.id); list.unshift(e); saveHist(list); renderHist(); }
function persist() { const list = loadHist(); const e = list.find((x) => x.id === currentId); if (e) { e.history = history; saveHist(list); } }
function renderHist() {
  const list = loadHist();
  $('histList').innerHTML = list.length ? list.map((e) => {
    const name = esc(e.files && e.files.length ? e.files.join(', ') : 'Analysis');
    const when = new Date(e.time).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    return '<li><button class="hitem' + (e.id === currentId ? ' on' : '') + '" data-open="' + e.id + '" title="' + name + '"><span class="hname">' + name + '</span><span class="hmeta">' + esc(when) + ' · ' + e.rows + ' rows</span></button><button class="hdel" data-del="' + e.id + '" aria-label="Delete this saved analysis" title="Delete">×</button></li>';
  }).join('') : '<li class="hnote">No analyses yet. Files you analyze will appear here.</li>';
  $('histClear').hidden = !list.length;
}
function openEntry(id) {
  const e = loadHist().find((x) => x.id === id); if (!e) return;
  currentId = id; lastPayload = e.payload; history = e.history || []; reportMd = e.report; lastCharts = e.charts || []; lastSpecs = [];
  $('out').innerHTML = md(reportMd); $('charts').innerHTML = ''; drawComputed(lastCharts, $('charts'));
  $('result').hidden = false; $('chat').hidden = false; $('log').innerHTML = '';
  history.slice(1).forEach((h) => add(h.role === 'user' ? 'me' : 'ai', h.role === 'user' ? esc(h.text) : md(splitCharts(h.text).txt)));
  $('info').textContent = 'Opened saved report: ' + (e.files || []).join(', ') + '. To ask new questions about it, use the chat below.';
  $('err').textContent = ''; renderHist();
  $('result').scrollIntoView({ behavior: 'smooth' });
}
$('histList').addEventListener('click', (ev) => {
  const o = ev.target.closest('[data-open]'), d = ev.target.closest('[data-del]');
  if (o) openEntry(Number(o.dataset.open));
  else if (d) { saveHist(loadHist().filter((x) => x.id !== Number(d.dataset.del))); renderHist(); }
});
$('histClear').addEventListener('click', () => { if (confirm('Delete all saved analyses from this browser?')) { saveHist([]); renderHist(); } });
renderHist();
</script>
