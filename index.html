<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vunja AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2f6;--ink:#14213d;--muted:#5b6678;--line:#cfd8e3;--card:#fff;--teal:#0f7b6c;--saffron:#f4a300}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--ink:#e8eef7;--muted:#9aa7ba;--line:#26344d;--card:#16213a;--teal:#38c2ad;--saffron:#f4b73a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 18px 60px}
h1{font:800 clamp(44px,12vw,84px)/.95 "Bricolage Grotesque",sans-serif;margin:0 0 10px;letter-spacing:-.02em}
h1 span{color:var(--saffron)}
.lead{color:var(--muted);margin:0 0 28px;max-width:52ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=file],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
button{font:600 17px "Source Sans 3",sans-serif;padding:12px 22px;border:0;border-radius:8px;cursor:pointer;background:var(--teal);color:#fff}
button.alt{background:var(--saffron);color:#14213d}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
#info,#err{margin:10px 0 0;font-size:15px}#info{color:var(--muted)}#err{color:#c0392b}
#out h2,#out h3{font-family:"Bricolage Grotesque",sans-serif;margin:1.2em 0 .4em}
#out table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:10px 0}
#out th,#out td{border:1px solid var(--line);padding:6px 10px;text-align:left}
#out th{background:var(--bg)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Vunja <span>AI</span></h1>
<p class="lead">Pakia faili la takwimu zako. Vunja AI inazichambua na kukuandikia ripoti unayoweza kupakua.</p>

<section class="panel">
  <label for="file">Faili la data (Excel au CSV)</label>
  <input id="file" type="file" accept=".xlsx,.xls,.csv">
  <p id="info">Hakuna faili lililochaguliwa.</p>
  <div class="row" style="margin-top:14px">
    <div>
      <label for="req">Unataka nini kichambuliwe?</label>
      <textarea id="req" placeholder="Mfano: Linganisha mauzo kwa mwezi na nionyeshe bidhaa zinazouzika zaidi."></textarea>
    </div>
    <div style="max-width:200px">
      <label for="lang">Lugha ya ripoti</label>
      <select id="lang"><option value="sw">Kiswahili</option><option value="en">Kiingereza</option></select>
    </div>
  </div>
  <div class="actions"><button id="go" disabled>Chambua data</button></div>
  <p id="err" role="alert"></p>
</section>

<section class="panel" id="result" hidden>
  <div id="out"></div>
  <div class="actions">
    <button class="alt" id="word">Pakua kama Word</button>
    <button class="alt" id="copy">Nakili ripoti</button>
  </div>
</section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let rows = [], headers = [], reportMd = '';

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  $('err').textContent = '';
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    headers = rows.length ? Object.keys(rows[0]) : [];
    $('info').textContent = rows.length + ' safu, nguzo ' + headers.length + ': ' + headers.join(', ');
    $('go').disabled = !rows.length;
  } catch (x) { $('err').textContent = 'Faili halikusomeka. Hakikisha ni Excel au CSV.'; }
});

function stats() {
  return headers.map((h) => {
    const vals = rows.map((r) => r[h]);
    const nums = vals.map(Number).filter((n, i) => vals[i] !== '' && !isNaN(n));
    if (nums.length > vals.length * 0.7) {
      const sum = nums.reduce((a, b) => a + b, 0);
      return h + ': namba, idadi=' + nums.length + ', jumla=' + sum.toFixed(2) + ', wastani=' + (sum / nums.length).toFixed(2) + ', chini=' + Math.min(...nums) + ', juu=' + Math.max(...nums);
    }
    const c = {}; vals.forEach((v) => { c[v] = (c[v] || 0) + 1; });
    const top = Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, n]) => k + '(' + n + ')').join(', ');
    return h + ': maandishi, tofauti=' + Object.keys(c).length + ', za juu: ' + top;
  }).join('\n');
}

$('go').addEventListener('click', async () => {
  $('go').disabled = true; $('go').textContent = 'Inachambua...'; $('err').textContent = '';
  try {
    const sample = XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(rows.slice(0, 150)));
    const r = await fetch('/api/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ summary: 'Jumla ya safu: ' + rows.length + '\n' + stats(), sample, request: $('req').value, lang: $('lang').value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Imeshindwa');
    reportMd = d.report; $('out').innerHTML = md(reportMd); $('result').hidden = false;
    $('result').scrollIntoView({ behavior: 'smooth' });
  } catch (x) { $('err').textContent = 'Kosa: ' + x.message; }
  $('go').disabled = false; $('go').textContent = 'Chambua data';
});

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function inl(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>'); }
function md(t) {
  const L = t.split('\n'); let h = '', list = false, tbl = [];
  const endList = () => { if (list) { h += '</ul>'; list = false; } };
  const endTbl = () => {
    if (!tbl.length) return;
    const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => inl(c.trim()));
    const body = tbl.filter((l) => !/^\s*\|?[\s:-]+\|[\s|:-]*$/.test(l));
    h += '<table>' + body.map((l, i) => '<tr>' + cells(l).map((c) => (i ? '<td>' : '<th>') + c + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>';
    tbl = [];
  };
  for (const l of L) {
    if (/^\s*\|/.test(l)) { endList(); tbl.push(l); continue; } else endTbl();
    if (/^#{1,3}\s/.test(l)) { endList(); h += '<h2>' + inl(l.replace(/^#+\s/, '')) + '</h2>'; }
    else if (/^\s*[-*]\s+/.test(l)) { if (!list) { h += '<ul>'; list = true; } h += '<li>' + inl(l.replace(/^\s*[-*]\s+/, '')) + '</li>'; }
    else if (l.trim()) { endList(); h += '<p>' + inl(l) + '</p>'; }
  }
  endList(); endTbl(); return h;
}

$('word').addEventListener('click', () => {
  const html = '<html><head><meta charset="utf-8"><title>Ripoti</title></head><body>' + $('out').innerHTML + '</body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + html], { type: 'application/msword' }));
  a.download = 'Ripoti-Vunja-AI.doc'; a.click();
});
$('copy').addEventListener('click', () => { navigator.clipboard.writeText(reportMd); $('copy').textContent = 'Imenakiliwa'; });
</script>
</body>
</html>
